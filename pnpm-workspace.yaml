packages:
  - apps/*
  - packages/*

overrides:
  # Drizzle's legacy config loader must not resolve vulnerable esbuild 0.18.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  fastify: 5.12.5
  'fast-uri@^3.0.0': 3.1.8
  'fast-uri@^4.0.0': 4.1.5
  'js-yaml@^4.0.0': 4.3.2
  source-map-js: 1.2.2

allowBuilds:
  core-js: false
  esbuild: true
  msgpackr-extract: false
  msw: false
  protobufjs: false

packages:
  - apps/*
  - packages/*

# Review dates, reasons and removal conditions: docs/operations/dependency-reviews.md.
overrides:
  # Keep optional peers on the same SDK-compatible API and Drizzle identity.
  '@opentelemetry/api': 1.10.0
  # Drizzle's legacy config loader must not resolve vulnerable esbuild 0.18.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  fastify: 5.12.8
  'fast-uri@^3.0.0': 3.1.9
  'fast-uri@^4.0.0': 4.2.3
  'js-yaml@^4.0.0': 4.3.2
  source-map-js: 1.2.2
  # Stryker's typed-rest-client pins qs 6.15.1, which has four moderate DoS advisories.
  'typed-rest-client>qs': 6.17.1
  # Stryker and typescript-eslint pull minimatch 10.2.6; the ReDoS advisory is fixed only in 11.0.1.
  'minimatch@>=7.0.0 <11.0.1': 11.0.1

allowBuilds:
  core-js: false
  esbuild: true
  msgpackr-extract: false
  msw: false
  protobufjs: false

patchedDependencies:
  ioredis@6.0.0: patches/ioredis@6.0.0.patch

packages:
  - apps/*
  - packages/*

# Review dates, reasons and removal conditions: docs/operations/dependency-reviews.md.
overrides:
  # Keep optional peers on the same SDK-compatible API and Drizzle identity.
  '@opentelemetry/api': 1.10.0
  # Drizzle's legacy config loader must not resolve vulnerable esbuild 0.18.
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  fastify: 5.12.8
  'fast-uri@^3.0.0': 3.1.9
  'fast-uri@^4.0.0': 4.2.3
  'js-yaml@^4.0.0': 4.3.2
  source-map-js: 1.2.2

allowBuilds:
  core-js: false
  esbuild: true
  msgpackr-extract: false
  msw: false
  protobufjs: false

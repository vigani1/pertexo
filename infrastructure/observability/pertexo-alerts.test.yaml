rule_files:
  - /etc/prometheus/pertexo-alerts.yaml

evaluation_interval: 15s

tests:
  - name: no traffic does not manufacture an API error-budget alert
    interval: 15s
    alert_rule_test:
      - eval_time: 20m
        alertname: PertexoApiEligibleErrorBudgetBurn
        exp_alerts: []

  - name: five recent worker starts remain below the existing threshold
    interval: 15s
    input_series:
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-1"}
        values: 60+0x40
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-2"}
        values: 60+0x40
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-3"}
        values: 60+0x40
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-4"}
        values: 60+0x40
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-5"}
        values: 60+0x40
    alert_rule_test:
      - eval_time: 6m
        alertname: PertexoWorkerRestartBurst
        exp_alerts: []

  - name:
      six recent writer starts honor the five-minute for duration and age out
    interval: 15s
    input_series:
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-1"}
        values: 60+0x80
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-2"}
        values: 60+0x80
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-3"}
        values: 60+0x80
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-4"}
        values: 60+0x80
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-5"}
        values: 60+0x80
      - series: pertexo_worker_process_start_time_seconds{service_instance_id="worker-6"}
        values: 60+0x80
    alert_rule_test:
      - eval_time: 4m45s
        alertname: PertexoWorkerRestartBurst
        exp_alerts: []
      - eval_time: 5m
        alertname: PertexoWorkerRestartBurst
        exp_alerts:
          - exp_labels:
              severity: ticket
            exp_annotations:
              summary: Worker process starts indicate elevated churn
              description:
                More than five distinct worker telemetry writers reported a
                start time in the last fifteen minutes.
              runbook_url: https://github.com/vigani1/pertexo/blob/main/docs/operations/observability-alerts.md#pertexoworkerrestartburst
      - eval_time: 16m15s
        alertname: PertexoWorkerRestartBurst
        exp_alerts: []

  - name: a counter reset does not erase an observed webhook outage
    interval: 1m
    input_series:
      - series: pertexo_webhook_delivery_count_total{outcome="unavailable"}
        values: 0 1 0 0 0 0 0 0
    alert_rule_test:
      - eval_time: 5m
        alertname: PertexoWebhookUnavailable
        exp_alerts: []
      - eval_time: 6m
        alertname: PertexoWebhookUnavailable
        exp_alerts:
          - exp_labels:
              outcome: unavailable
              severity: page
            exp_annotations:
              summary: Webhook durable acceptance is unavailable
              description:
                At least one webhook delivery was rejected as unavailable during
                the last ten minutes.
              runbook_url: https://github.com/vigani1/pertexo/blob/main/docs/operations/observability-alerts.md#pertexowebhookunavailable

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: [--config=/etc/otelcol/config.yaml]
    read_only: true
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
      - 127.0.0.1:9464:9464
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command: [--config.file=/etc/prometheus/prometheus.yaml]
    read_only: true
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./pertexo-alerts.yaml:/etc/prometheus/pertexo-alerts.yaml:ro
      - ./pertexo-alerts.test.yaml:/etc/prometheus/pertexo-alerts.test.yaml:ro
    tmpfs:
      - /prometheus:mode=1777
      - /tmp:mode=1777
    ports:
      - 127.0.0.1:9093:9090
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: local-only
    read_only: true
    tmpfs:
      - /var/lib/grafana
    volumes:
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/pertexo.json:ro
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/pertexo.yaml:ro
    ports:
      - 127.0.0.1:3001:3000

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    command: [--config=/etc/otelcol/config.yaml]
    read_only: true
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
      - 127.0.0.1:9464:9464
  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    command: [--config.file=/etc/prometheus/prometheus.yaml]
    read_only: true
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./pertexo-alerts.yaml:/etc/prometheus/pertexo-alerts.yaml:ro
      - ./pertexo-alerts.test.yaml:/etc/prometheus/pertexo-alerts.test.yaml:ro
    tmpfs:
      - /prometheus:mode=1777
      - /tmp:mode=1777
    ports:
      - 127.0.0.1:9093:9090
  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: local-only
    read_only: true
    tmpfs:
      - /var/lib/grafana
    volumes:
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/pertexo.json:ro
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/pertexo.yaml:ro
    ports:
      - 127.0.0.1:3001:3000

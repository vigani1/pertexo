services:
  otel-collector:
    # otel/opentelemetry-collector-contrib:0.136.0; manifest digest resolved 2026-08-30
    image: otel/opentelemetry-collector-contrib:0.136.0@sha256:45392d534c1edcc809c2d112394029246bc679d2ae5ea7081414a1fc74f2c621
    command: [--config=/etc/otelcol/config.yaml]
    read_only: true
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - 127.0.0.1:4317:4317
      - 127.0.0.1:4318:4318
      - 127.0.0.1:9464:9464
  prometheus:
    # prom/prometheus:v3.6.0; manifest digest resolved 2026-08-30
    image: prom/prometheus:v3.6.0@sha256:76947e7ef22f8a698fc638f706685909be425dbe09bd7a2cd7aca849f79b5f64
    command: [--config.file=/etc/prometheus/prometheus.yaml]
    read_only: true
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./pertexo-alerts.yaml:/etc/prometheus/pertexo-alerts.yaml:ro
    ports:
      - 127.0.0.1:9093:9090
  grafana:
    # grafana/grafana:12.2.0; manifest digest resolved 2026-08-30
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: local-only
    read_only: true
    tmpfs:
      - /var/lib/grafana
    volumes:
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/pertexo.json:ro
      - ./grafana-datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/pertexo.yaml:ro
    ports:
      - 127.0.0.1:3001:3000

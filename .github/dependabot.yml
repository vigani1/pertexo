version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Europe/Belgrade
    cooldown:
      default-days: 7
    open-pull-requests-limit: 12
    versioning-strategy: increase-if-necessary
    # One weekly batch: each pull request reruns the full CI and rebases
    # whenever the lockfile changes on main, so many small ones crowd it out.
    groups:
      weekly:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Deferred in docs/operations/dependency-updates.md.
      - dependency-name: '@xmldom/xmldom'
        versions:
          - '>=0.9.0'
      # OpenTelemetry 3 migration: see dependency-updates.md.
      - dependency-name: '@opentelemetry/exporter-metrics-otlp-http'
        versions:
          - '0.301.0'
      - dependency-name: '@opentelemetry/exporter-trace-otlp-http'
        versions:
          - '0.301.0'
      - dependency-name: '@opentelemetry/instrumentation-host-metrics'
        versions:
          - '0.7.0'
      - dependency-name: '@opentelemetry/instrumentation-http'
        versions:
          - '0.301.0'
      - dependency-name: '@opentelemetry/instrumentation-nestjs-core'
        versions:
          - '0.71.0'
      - dependency-name: '@opentelemetry/instrumentation-pg'
        versions:
          - '0.77.0'
      - dependency-name: '@opentelemetry/instrumentation-pino'
        versions:
          - '0.70.0'
      - dependency-name: '@opentelemetry/instrumentation-runtime-node'
        versions:
          - '0.37.0'
      - dependency-name: '@opentelemetry/instrumentation-undici'
        versions:
          - '0.34.0'
      - dependency-name: '@opentelemetry/sdk-node'
        versions:
          - '0.301.0'
      - dependency-name: '@opentelemetry/api'
        versions:
          - '1.10.0'
    commit-message:
      prefix: build
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Belgrade
    cooldown:
      default-days: 7
    open-pull-requests-limit: 4
    groups:
      images:
        patterns:
          - '*'
    ignore:
      - dependency-name: node
        versions:
          - '>=25'
    commit-message:
      prefix: build
    labels:
      - dependencies
      - infrastructure

  - package-ecosystem: docker-compose
    directories:
      - /
      - /infrastructure/single-server
      - /infrastructure/single-server/backup
      - /infrastructure/observability
      - /infrastructure/quickstart
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Belgrade
    cooldown:
      default-days: 7
    groups:
      services:
        patterns: ['*']
    commit-message:
      prefix: build
    labels: [dependencies, infrastructure]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Belgrade
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
    labels: [dependencies, infrastructure]

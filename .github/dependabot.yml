version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Europe/Belgrade
    open-pull-requests-limit: 12
    versioning-strategy: increase-if-necessary
    # One weekly batch: each pull request reruns the full CI and rebases
    # whenever the lockfile changes on main, so many small ones crowd it out.
    groups:
      weekly:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # Deferred in docs/operations/dependency-updates.md.
      - dependency-name: '@xmldom/xmldom'
        versions:
          - '>=0.9.0'
    commit-message:
      prefix: build
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Belgrade
    open-pull-requests-limit: 4
    groups:
      images:
        patterns:
          - '*'
    ignore:
      - dependency-name: node
        versions:
          - '>=25'
    commit-message:
      prefix: build
    labels:
      - dependencies
      - infrastructure

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:30'
      timezone: Europe/Belgrade
    open-pull-requests-limit: 12
    versioning-strategy: increase-if-necessary
    groups:
      production-http-stack:
        dependency-type: production
        patterns:
          - '@nestjs/*'
          - fastify
        update-types:
          - minor
          - patch
      production-validation:
        dependency-type: production
        patterns:
          - zod
        update-types:
          - minor
          - patch
      production-aws:
        dependency-type: production
        patterns:
          - '@aws-sdk/*'
        update-types:
          - minor
          - patch
      production-telemetry:
        dependency-type: production
        patterns:
          - '@opentelemetry/*'
        update-types:
          - minor
          - patch
      production-queue:
        dependency-type: production
        patterns:
          - bullmq
        update-types:
          - minor
          - patch
      production-routine:
        dependency-type: production
        patterns:
          - jose
          - uuid
        update-types:
          - minor
          - patch
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: build
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Belgrade
    open-pull-requests-limit: 4
    ignore:
      - dependency-name: node
        versions:
          - '>=25'
    commit-message:
      prefix: build
    labels:
      - dependencies
      - infrastructure

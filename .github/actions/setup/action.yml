name: Set up workspace
description: Install pnpm, Node.js and the frozen workspace dependencies.
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 11.22.0
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
    # Ubuntu 26.04 mounts /tmp in RAM; file scratch qualification requires disk.
    - name: Use disk-backed temporary storage
      shell: bash
      run: |
        temporary_root="$(mktemp -d "$RUNNER_TEMP/pertexo-tests.XXXXXX")"
        printf 'TMPDIR=%s\n' "$temporary_root" >> "$GITHUB_ENV"
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

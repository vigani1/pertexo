name: Simulate browsers

# Runs the mocked browser suite in Firefox, WebKit and the phone profiles, and
# the screen-reader journeys. Never on pull requests, main or a schedule: run
# it by hand, or push a throwaway sim/browsers/<n> branch.
on:
  workflow_dispatch:
    inputs:
      voiceover:
        description: Also try the real VoiceOver journeys on macOS
        type: boolean
        default: false
  push:
    branches: ['sim/browsers/**']

permissions:
  contents: read

concurrency:
  group: simulate-browsers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mocked:
    name: mocked (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: firefox, shard: 1/4 }
          - { project: firefox, shard: 2/4 }
          - { project: firefox, shard: 3/4 }
          - { project: firefox, shard: 4/4 }
          - { project: webkit, shard: 1/4, workers: 1 }
          - { project: webkit, shard: 2/4, workers: 1 }
          - { project: webkit, shard: 3/4, workers: 1 }
          - { project: webkit, shard: 4/4, workers: 1 }
          - { project: ios-safari, shard: 1/3, workers: 1 }
          - { project: ios-safari, shard: 2/3, workers: 1 }
          - { project: ios-safari, shard: 3/3, workers: 1 }
          - { project: android-chrome, shard: 1/2 }
          - { project: android-chrome, shard: 2/2 }
    # Playwright's own image for the pinned @playwright/test version: every
    # browser and its system libraries are inside, so no apt mirror can stall
    # the run. Bump it with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
      options: --user 1001 --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Build what the mocked suite imports
        run:
          pnpm --filter '@pertexo/node-catalog...' --filter
          '@pertexo/workflow-engine...' build
      - name: Mocked suite
        env:
          PROJECT: ${{ matrix.project }}
          SHARD: ${{ matrix.shard }}
          # WebKit on the runner is the slowest engine; one test at a time
          # keeps its longest journeys and clock-driven retries inside 30 s.
          WORKERS: ${{ matrix.workers || 2 }}
        run:
          pnpm --filter @pertexo/web exec playwright test --config
          playwright.browsers.config.ts --project "$PROJECT" --shard "$SHARD"
          --workers="$WORKERS" --reporter=list
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name:
            simulate-browsers-${{ matrix.project }}-${{ strategy.job-index }}
          path: apps/web/test-results/
          if-no-files-found: ignore

  # A real screen reader: VoiceOver on macOS, driven by Guidepup through
  # WebKit, on the sign-in and run-result journeys. Only on request: on the
  # hosted macos-15 runner (2026-11-19) VoiceOver did not hear focus moves,
  # and once stopped mid-journey ("VoiceOver not running"), so a failure here
  # does not yet say anything about the app.
  voiceover:
    name: voiceover (macOS)
    if: inputs.voiceover
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Install WebKit
        run: pnpm --filter @pertexo/web exec playwright install webkit
      - name: Let VoiceOver be driven by AppleScript
        run: |
          pnpm --filter @pertexo/web exec guidepup setup --ci
          # The VoiceOver preferences Guidepup mounts when it starts.
          pnpm --filter @pertexo/web exec guidepup install
      - name: Build what the mocked suite imports
        run:
          pnpm --filter '@pertexo/node-catalog...' --filter
          '@pertexo/workflow-engine...' build
      - name: VoiceOver journeys
        run:
          pnpm --filter @pertexo/web exec playwright test --config
          playwright.voiceover.config.ts --reporter=list
      - name: Upload VoiceOver traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulate-browsers-voiceover
          path: apps/web/test-results/
          if-no-files-found: ignore

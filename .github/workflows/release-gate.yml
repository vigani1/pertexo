name: Release Gate

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  local-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run locally reproducible release gates
        run: pnpm release:check

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image
        run: docker build --tag pertexo-release-gate:${{ github.sha }} .

      - name: Prove non-root read-only runtime
        run: |
          test "$(docker run --rm --read-only --tmpfs /tmp --entrypoint id pertexo-release-gate:${{ github.sha }} -u)" = 10001
          docker run --rm --read-only --tmpfs /tmp --entrypoint node pertexo-release-gate:${{ github.sha }} --version

      - name: Scan production image
        uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: pertexo-release-gate:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

name: Simulate load

# Drives the production stack at its documented minimum size (a 4 GiB, 2 vCPU
# host, made as one cgroup) on real Linux runners: an hour of a small team's
# mixed traffic, and separately a ramp past capacity until something gives.
# The sizing input `j1` instead applies the J1 qualification's per-service caps.
# A third scenario keeps the worker at its busiest everyday work and reads its
# own memory figures. Started by hand or by pushing a throwaway sim/load/<n>,
# sim/load-shed/<n>, sim/inline/<n> or sim/worker-memory/<n> branch (the last runs only the
# worker scenario); never on pull requests, main or a schedule.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes of steady load
        default: '60'
      stage-minutes:
        description: Minutes per overload stage
        default: '3'
      sizing:
        description: host (one 4 GiB cgroup) or j1 (per-service caps)
        default: host
      scenario:
        description: all, steady, overload, worker-memory or j7
        default: all
      inline-steps:
        description:
          Coordinator inline steps (paired against the same pure pins)
        type: boolean
        default: false
  push:
    branches:
      [
        'sim/load/**',
        'sim/load-shed/**',
        'sim/worker-memory/**',
        'sim/inline/**',
      ]

permissions:
  contents: read

concurrency:
  group:
    simulate-load-${{ github.ref }}-${{ inputs.inline-steps || github.event_name
    }}
  cancel-in-progress: true

jobs:
  simulate:
    name: simulate (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    # Allow about 15 minutes for setup and up to 40 for drain. Up to 90 minutes
    # of load keeps the 150-minute budget; longer soaks get 355, under GitHub's 360.
    timeout-minutes: ${{ fromJSON(inputs.minutes || '60') > 90 && 355 || 150 }}
    env:
      COMPOSE_PROJECT_NAME:
        pertexo-ci-${{ github.run_id }}-${{ github.run_attempt }}-integration
    strategy:
      fail-fast: false
      matrix:
        scenario: >-
          ${{ fromJSON(
            inputs.scenario && inputs.scenario != 'all' && format('["{0}"]',
          inputs.scenario)
            || startsWith(github.ref_name, 'sim/worker-memory/') &&
          '["worker-memory"]'
            || startsWith(github.ref_name, 'sim/inline/') && github.event_name
          == 'push' &&
            '["steady", "overload", "worker-memory", "j7"]'
            || '["steady", "overload", "worker-memory"]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the Docker Hub mirror
        uses: ./.github/actions/docker-mirror
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Configure J7 test services
        if: matrix.scenario == 'j7'
        run: |
          cat >> "$GITHUB_ENV" <<'ENV'
          DATABASE_ADMIN_URL=postgresql://postgres:pertexo-local-superuser@127.0.0.1:5432/postgres
          DATABASE_MIGRATION_URL=postgresql://pertexo_migration:pertexo-local-migration@127.0.0.1:5432/pertexo
          DATABASE_URL=postgresql://pertexo_app:pertexo-local-app@127.0.0.1:5432/pertexo
          DATABASE_MAINTENANCE_URL=postgresql://pertexo_maintenance:pertexo-local-maintenance@127.0.0.1:5432/pertexo
          REDIS_URL=redis://:pertexo-local-redis@127.0.0.1:6379/0
          ENV
      - name: Start J7 test services
        if: matrix.scenario == 'j7'
        uses: ./.github/actions/start-services
      - name: Run paired J7 bursts
        if: matrix.scenario == 'j7'
        env:
          J7_MEASURE: 'true'
          J7_REPORT: ${{ runner.temp }}/report.json
          WORKER_TRANSPORT_INTEGRATION: 'true'
        run: |
          command pnpm build:packages
          command pnpm db:migrate
          command pnpm --filter @pertexo/worker exec vitest run --config vitest.integration.config.ts \
            --testTimeout 1500000 --hookTimeout 120000 \
            test/runs/consumer/j7-measure.integration.test.ts
      - name: Stop J7 test services
        if: always() && matrix.scenario == 'j7'
        run: docker compose down -v --remove-orphans
      - name: Build the images once
        if: matrix.scenario != 'j7'
        run:
          .github/scripts/retry-once.sh node
          infrastructure/single-server/test/drill/build-images.mjs
      # The runbook's minimum server: every service in one cgroup with 4 GiB,
      # no swap and two CPUs, whichever cgroup driver Docker uses.
      - name: Make a 4 GiB, 2 vCPU host inside the runner
        if: matrix.scenario != 'j7'
        run: |
          if [ "$(docker info --format '{{.CgroupDriver}}')" = systemd ]; then
            printf '[Slice]\nMemoryMax=4G\nMemorySwapMax=0\nCPUQuota=200%%\n' |
              sudo tee /run/systemd/system/pertexohost.slice
            sudo systemctl daemon-reload
            sudo systemctl start pertexohost.slice
            parent=pertexohost.slice
            path=/sys/fs/cgroup/pertexohost.slice
          else
            sudo mkdir -p /sys/fs/cgroup/pertexohost
            echo 4G | sudo tee /sys/fs/cgroup/pertexohost/memory.max
            echo 0 | sudo tee /sys/fs/cgroup/pertexohost/memory.swap.max
            echo '200000 100000' | sudo tee /sys/fs/cgroup/pertexohost/cpu.max
            parent=/pertexohost
            path=/sys/fs/cgroup/pertexohost
          fi
          cat "$path/memory.max" "$path/cpu.max"
          echo "LOAD_HOST_CGROUP_PARENT=$parent" >> "$GITHUB_ENV"
          echo "LOAD_HOST_CGROUP_PATH=$path" >> "$GITHUB_ENV"
      - name: Simulate
        if: matrix.scenario != 'j7'
        env:
          SCENARIO: ${{ matrix.scenario }}
          LOAD_MINUTES: ${{ inputs.minutes || '60' }}
          OVERLOAD_STAGE_MINUTES: ${{ inputs.stage-minutes || '3' }}
          WORKFLOW_COORDINATOR_INLINE_STEPS:
            ${{ inputs.inline-steps || (github.event_name == 'push' &&
            startsWith(github.ref_name, 'sim/inline/')) || false }}
          LOAD_SIZING: ${{ inputs.sizing || 'host' }}
          SIMULATION_REPORT: ${{ runner.temp }}/report.json
          # The runner is thrown away; keeping the stack lets the next step show its logs.
          DRILL_KEEP: 'true'
        run: |
          node --test --test-reporter=spec \
            "infrastructure/single-server/test/drill/load/$SCENARIO.test.mjs"
      - name: Show what the kernel killed
        if: always()
        run: |
          { echo '### Kernel OOM log'; echo '```'
            sudo dmesg --ctime | grep -iE 'out of memory|oom-kill|killed process' | tail -40 || true
            if [ -n "$LOAD_HOST_CGROUP_PATH" ]; then
              cat "$LOAD_HOST_CGROUP_PATH/memory.events.local"
            fi
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Summarize what the load showed
        if: always()
        run: |
          report="$RUNNER_TEMP/report.json"
          if [ -f "$report" ]; then
            { echo '```json'; cat "$report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.scenario }}-report
          path: ${{ runner.temp }}/report.json
          if-no-files-found: ignore
      - name: Show the API's memory while it turned work away
        if: always()
        run: |
          for container in $(docker ps --all --quiet --filter label=com.docker.compose.project=pertexo-b1-singleserver --filter label=com.docker.compose.service=api); do
            docker logs "$container" 2>&1 | grep 'http.server_busy' | tail -60 || true
          done
      - name: Show the logs on failure
        if: failure()
        run: |
          for container in $(docker ps --all --quiet --filter label=com.docker.compose.project=pertexo-b1-singleserver); do
            echo "::group::$(docker inspect --format '{{.Name}}' "$container")"
            docker logs --tail 300 "$container" 2>&1 || true
            echo '::endgroup::'
          done

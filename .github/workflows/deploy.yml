name: Deploy beta

on:
  workflow_dispatch:
    inputs:
      commit:
        description:
          Full lowercase SHA of a main commit with successful CI and image
          publication
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: beta-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted main control scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Verify main CI and image publication
        env:
          GH_TOKEN: ${{ github.token }}
          BETA_COMMIT: ${{ inputs.commit }}
        run:
          node infrastructure/single-server/delivery/verify-ci.mjs
          "$BETA_COMMIT"
      - name: Deploy over pinned SSH
        env:
          BETA_COMMIT: ${{ inputs.commit }}
          BETA_SSH_HOST: ${{ secrets.BETA_SSH_HOST }}
          BETA_SSH_USER: ${{ secrets.BETA_SSH_USER }}
          BETA_SSH_PRIVATE_KEY: ${{ secrets.BETA_SSH_PRIVATE_KEY }}
          BETA_SSH_KNOWN_HOSTS: ${{ secrets.BETA_SSH_KNOWN_HOSTS }}
        run: bash infrastructure/single-server/delivery/send.sh

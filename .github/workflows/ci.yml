name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run applicable Phase 0 quality gates
        run: pnpm check

      - name: Start PostgreSQL integration dependency
        run: docker compose up -d --wait postgres

      - name: Prove database migrations and RLS boundaries
        run: pnpm test:integration

      - name: Capture PostgreSQL logs
        if: failure()
        run: docker compose logs --no-color postgres

      - name: Stop integration dependencies
        if: always()
        run: docker compose down

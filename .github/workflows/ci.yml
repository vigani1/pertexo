name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every service-consuming job runs on its own runner and Compose project. This
# keeps databases and Redis disposable and prevents cross-job state races.
env:
  POSTGRES_DB: pertexo
  POSTGRES_PORT: '5432'
  POSTGRES_SUPERUSER: postgres
  POSTGRES_SUPERUSER_PASSWORD: pertexo-local-superuser
  POSTGRES_OWNER_USER: pertexo_owner
  POSTGRES_MIGRATION_USER: pertexo_migration
  POSTGRES_MIGRATION_PASSWORD: pertexo-local-migration
  POSTGRES_MAINTENANCE_USER: pertexo_maintenance
  POSTGRES_OPERATOR_USER: pertexo_operator
  POSTGRES_MAINTENANCE_PASSWORD: pertexo-local-maintenance
  POSTGRES_LIFECYCLE_COMMAND_USER: pertexo_lifecycle_command
  POSTGRES_LIFECYCLE_COMMAND_PASSWORD: pertexo-local-lifecycle-command
  POSTGRES_API_RUNTIME_USER: pertexo_api
  POSTGRES_API_RUNTIME_PASSWORD: pertexo-local-api
  POSTGRES_WORKER_RUNTIME_USER: pertexo_worker
  POSTGRES_WORKER_RUNTIME_PASSWORD: pertexo-local-worker
  POSTGRES_DISPATCHER_RUNTIME_USER: pertexo_dispatcher
  POSTGRES_DISPATCHER_RUNTIME_PASSWORD: pertexo-local-dispatcher
  DATABASE_ADMIN_URL: postgresql://postgres:pertexo-local-superuser@127.0.0.1:5432/postgres
  DATABASE_MIGRATION_URL: postgresql://pertexo_migration:pertexo-local-migration@127.0.0.1:5432/pertexo
  DATABASE_MAINTENANCE_URL: postgresql://pertexo_maintenance:pertexo-local-maintenance@127.0.0.1:5432/pertexo
  DATABASE_OPERATOR_URL: postgresql://pertexo_operator:pertexo-local-operator@127.0.0.1:5432/pertexo
  DATABASE_LIFECYCLE_COMMAND_URL: postgresql://pertexo_lifecycle_command:pertexo-local-lifecycle-command@127.0.0.1:5432/pertexo
  DATABASE_API_URL: postgresql://pertexo_api:pertexo-local-api@127.0.0.1:5432/pertexo
  DATABASE_WORKER_URL: postgresql://pertexo_worker:pertexo-local-worker@127.0.0.1:5432/pertexo
  DATABASE_DISPATCHER_URL: postgresql://pertexo_dispatcher:pertexo-local-dispatcher@127.0.0.1:5432/pertexo
  REDIS_PASSWORD: pertexo-local-redis
  REDIS_PORT: '6379'
  REDIS_URL: redis://:pertexo-local-redis@127.0.0.1:6379/0
  ARTIFACT_STORE_PORT: '9090'
  ARTIFACT_STORE_ENDPOINT: http://127.0.0.1:9090
  ARTIFACT_STORE_REGION: us-east-1
  ARTIFACT_STORE_ACCESS_KEY_ID: pertexo-local-access-key
  ARTIFACT_STORE_SECRET_ACCESS_KEY: pertexo-local-secret-key
  ARTIFACT_STORE_BUCKET: pertexo-artifacts
  ARTIFACT_STORE_FORCE_PATH_STYLE: 'true'
  ARTIFACT_STORE_RECOVERY_ENDPOINT: http://127.0.0.1:9090
  ARTIFACT_STORE_RECOVERY_REGION: us-west-2
  ARTIFACT_STORE_RECOVERY_ACCESS_KEY_ID: pertexo-local-recovery-access-key
  ARTIFACT_STORE_RECOVERY_SECRET_ACCESS_KEY: pertexo-local-recovery-secret-key
  ARTIFACT_STORE_RECOVERY_BUCKET: pertexo-artifacts-recovery
  ARTIFACT_STORE_RECOVERY_FORCE_PATH_STYLE: 'true'
  ARTIFACT_STORE_INTEGRATION: 'true'
  # CI pins the same reviewed manifests used by the Compose defaults.
  POSTGRES_IMAGE: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
  REDIS_IMAGE: redis:8.2.8-alpine@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103
  S3MOCK_IMAGE: adobe/s3mock:5.1.0@sha256:65cf60155a2e235fe7d5bf6c633747d6fc7ed93f9f5a6727d86470026b83c2a2
  MINIO_IMAGE: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  CONTROL_LEDGER_PORT: '9091'
  CONTROL_LEDGER_ENDPOINT: http://127.0.0.1:9091
  CONTROL_LEDGER_REGION: eu-central-1
  CONTROL_LEDGER_ACCESS_KEY_ID: pertexo-local-ledger-primary
  CONTROL_LEDGER_SECRET_ACCESS_KEY: pertexo-local-ledger-primary-secret
  CONTROL_LEDGER_ADMIN_ACCESS_KEY_ID: pertexo-local-primary-admin
  CONTROL_LEDGER_ADMIN_SECRET_ACCESS_KEY: pertexo-local-primary-admin-secret
  CONTROL_LEDGER_BUCKET: pertexo-control-ledger
  CONTROL_LEDGER_FORCE_PATH_STYLE: 'true'
  CONTROL_LEDGER_REQUEST_TIMEOUT_MS: '5000'
  CONTROL_LEDGER_MIN_RETENTION_DAYS: '30'
  CONTROL_LEDGER_RECOVERY_PORT: '9092'
  CONTROL_LEDGER_RECOVERY_ENDPOINT: http://127.0.0.1:9092
  CONTROL_LEDGER_RECOVERY_REGION: eu-west-1
  CONTROL_LEDGER_RECOVERY_ACCESS_KEY_ID: pertexo-local-ledger-recovery
  CONTROL_LEDGER_RECOVERY_SECRET_ACCESS_KEY: pertexo-local-ledger-recovery-secret
  CONTROL_LEDGER_RECOVERY_ADMIN_ACCESS_KEY_ID: pertexo-local-recovery-admin
  CONTROL_LEDGER_RECOVERY_ADMIN_SECRET_ACCESS_KEY: pertexo-local-recovery-admin-secret
  CONTROL_LEDGER_RECOVERY_BUCKET: pertexo-control-ledger-recovery
  CONTROL_LEDGER_RECOVERY_FORCE_PATH_STYLE: 'true'
  CONTROL_LEDGER_RECOVERY_REQUEST_TIMEOUT_MS: '5000'
  CONTROL_LEDGER_RECOVERY_MIN_RETENTION_DAYS: '30'
  CONTROL_LEDGER_INTEGRATION: 'true'
  CONTROL_LEDGER_INTEGRATION_PROVIDER: minio
  API_SSE_INTEGRATION: 'true'
  API_IDENTITY_INTEGRATION: 'true'
  API_WEBHOOK_INTEGRATION: 'true'
  REDIS_RATE_LIMIT_INTEGRATION: 'true'
  QUEUE_INTEGRATION: 'true'
  WORKER_TRANSPORT_INTEGRATION: 'true'
  WORKER_TRIGGER_INTEGRATION: 'true'

jobs:
  # Stable, dependency-free failure domain for source quality and compilation.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run quality checks
        run: |
          set -o pipefail
          mkdir -p artifacts
          {
            pnpm docs:check
            pnpm format:check
            pnpm runtime:check
            pnpm network-registry:check
            pnpm dependencies:check
            pnpm database:schema:check
            pnpm build
            pnpm lint
            pnpm complexity:check
            pnpm duplication:check
            pnpm contracts:check
            pnpm typecheck
          } 2>&1 | tee artifacts/quality.log
      - name: Upload quality log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: quality-log
          path: artifacts/
          if-no-files-found: ignore
      - name: Compare approved IANA address registries with upstream
        if: github.event_name == 'schedule'
        run: pnpm network-registry:check-upstream

  # Unit tests are independent and partitioned by workspace group. Integration
  # tests remain in the service-backed jobs below.
  unit-tests:
    name: unit-tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            packages:
              '@pertexo/contracts @pertexo/integrations @pertexo/node-catalog
              @pertexo/node-sdk @pertexo/nodes-core @pertexo/observability
              @pertexo/queue @pertexo/rate-limit @pertexo/workflow-engine
              @pertexo/workflow-model'
          - group: services
            packages:
              '@pertexo/api @pertexo/lifecycle-command @pertexo/operator-command
              @pertexo/recovery @pertexo/retention @pertexo/worker'
          - group: persistence
            packages: '@pertexo/artifact-store @pertexo/database'
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm build
      - name: Run ${{ matrix.group }} unit tests
        run: |
          set -o pipefail
          mkdir -p artifacts
          for package in ${{ matrix.packages }}; do
            pnpm --filter "$package" test
          done 2>&1 | tee artifacts/unit-${{ matrix.group }}.log
      - name: Run extended scheduled workflow model
        if: github.event_name == 'schedule' && matrix.group == 'core'
        env:
          WORKFLOW_MODEL_RUN_MULTIPLIER: '4'
        run: >-
          pnpm --filter @pertexo/workflow-engine exec vitest run
          test/state-machine-model.test.ts
      - name: Upload unit test log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-log-${{ matrix.group }}
          path: artifacts/
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm build
      - name: Enforce critical-module coverage baselines
        run: pnpm test:coverage
      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-summaries
          path: coverage/
          if-no-files-found: ignore

  production-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare image provenance output
        run: mkdir -p artifacts
      - name: Build production image
        run: |
          docker buildx build --load \
            --tag pertexo-ci:${{ github.sha }} \
            --metadata-file artifacts/production-image.build.json .
      - name: Prove non-root read-only runtime
        run: |
          test "$(docker run --rm --read-only --tmpfs /tmp --entrypoint id pertexo-ci:${{ github.sha }} -u)" = 10001
          docker run --rm --read-only --tmpfs /tmp --entrypoint node pertexo-ci:${{ github.sha }} --version
      - name: Prove production role dependency closure
        run: |
          docker run --rm --read-only --tmpfs /tmp --entrypoint node \
            pertexo-ci:${{ github.sha }} --input-type=module --eval \
            "await Promise.all([
              import('./apps/api/dist/app.js'),
              import('./apps/worker/dist/app.js'),
              import('./apps/lifecycle-command/dist/run.js'),
              import('./apps/retention/dist/run.js'),
              import('./apps/recovery/dist/restore-before-serve.js'),
              import('./apps/operator-command/dist/run.js'),
              import('./packages/database/dist/migrations.js')
            ])"
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: pertexo-ci:${{ github.sha }}
          format: cyclonedx-json
          output-file: artifacts/production-image.sbom.json
          upload-artifact: false
      - name: Scan production image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: pertexo-ci:${{ github.sha }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: json
          output-file: artifacts/production-image.scan.json
      - name: Bind image evidence to the built digest
        run: |
          node infrastructure/create-image-provenance.mjs \
            artifacts/production-image.build.json \
            artifacts/production-image.sbom.json \
            artifacts/production-image.scan.json \
            "${{ github.sha }}" \
            "pertexo-ci:${{ github.sha }}" \
            artifacts/production-image.provenance.json
      - name: Upload image provenance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: production-image-provenance
          path: artifacts/
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME:
        pertexo-ci-${{ github.run_id }}-${{ github.run_attempt }}-integration
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages used by integration fixtures
        run: pnpm build
      - name: Start disposable integration dependencies
        run: |
          docker compose up -d --wait postgres redis artifact-store control-ledger-primary control-ledger-recovery
          docker compose run --rm control-ledger-primary-bootstrap
          docker compose run --rm control-ledger-recovery-bootstrap
      - name: Verify service boundaries and Redis durability policy
        run: |
          set -euo pipefail
          test "$(docker compose port postgres 5432)" = "127.0.0.1:$POSTGRES_PORT"
          test "$(docker compose port redis 6379)" = "127.0.0.1:$REDIS_PORT"
          test "$(docker compose port artifact-store 9090)" = "127.0.0.1:$ARTIFACT_STORE_PORT"
          unauthenticated_output="$(docker compose exec -T redis redis-cli --raw ping 2>&1 | tr -d '\r')"
          case "$unauthenticated_output" in
            NOAUTH*) ;;
            *) echo "::error::Redis accepted an unauthenticated command"; exit 1 ;;
          esac
          test "$(docker compose exec -T redis redis-cli --raw --no-auth-warning -a "$REDIS_PASSWORD" ping)" = PONG
      - name: Run real PostgreSQL, Redis, and object-store integration suites
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm db:migrate
          pnpm --filter @pertexo/artifact-store exec vitest run --config vitest.integration.config.ts \
            --reporter=json --outputFile=../../artifacts/artifact-store-gates.json
          pnpm --filter @pertexo/queue exec vitest run --config vitest.integration.config.ts \
            --reporter=json --outputFile=../../artifacts/queue-gates.json
          pnpm --filter @pertexo/database exec vitest run --config vitest.integration-coverage.config.ts --coverage \
            --reporter=json --outputFile=../../artifacts/database-gates.json
          pnpm --filter @pertexo/database test:coverage
          pnpm database:coverage:merge
          pnpm --filter @pertexo/worker exec vitest run --config vitest.integration.config.ts \
            --reporter=json --outputFile=../../artifacts/worker-gates.json
          pnpm --filter @pertexo/api exec vitest run --config vitest.integration.config.ts \
            test/executions/run-event-stream.integration.test.ts \
            test/identity-workspace/real-api.integration.test.ts \
            test/webhooks/direct-webhook.integration.test.ts \
            test/rate-limit/distributed-rate-limiter.integration.test.ts \
            --reporter=json --outputFile=../../artifacts/api-gates.json
      - name: Prove every required integration cohort executed
        run: |
          node infrastructure/validate-vitest-gate-report.mjs \
            artifacts/artifact-store-gates.json 'artifact-store integration gates' 5 3
          node infrastructure/validate-vitest-gate-report.mjs \
            artifacts/queue-gates.json 'queue integration gates' 1
          node infrastructure/validate-vitest-gate-report.mjs \
            artifacts/database-gates.json 'database integration gates' 288
          node infrastructure/validate-vitest-gate-report.mjs \
            artifacts/worker-gates.json 'worker integration gates' 21
          node infrastructure/validate-vitest-gate-report.mjs \
            artifacts/api-gates.json 'API integration gates' 11
      - name: Capture integration logs
        if: failure()
        run: |
          docker compose ps --all > artifacts/service-status.log
          docker compose logs --no-color --timestamps postgres redis artifact-store control-ledger-primary control-ledger-recovery > artifacts/service-logs.log
      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: integration-reports
          path: artifacts/
          if-no-files-found: ignore
      - name: Upload database integration coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: database-integration-coverage
          path: |
            coverage/database-integration/
            coverage/database-combined/
          if-no-files-found: error
      - name: Stop disposable dependencies
        if: always()
        run: docker compose down -v --remove-orphans

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME:
        pertexo-ci-${{ github.run_id }}-${{ github.run_attempt }}-recovery
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages used by recovery fixtures
        run: pnpm build
      - name: Start disposable recovery dependencies
        run:
          docker compose up -d --wait postgres redis artifact-store
          control-ledger-primary control-ledger-recovery
      - name: Run destructive crash, outage, and recovery proofs
        env:
          API_SSE_RESILIENCE_INTEGRATION: 'true'
          WORKER_TRANSPORT_RESILIENCE: 'true'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm db:migrate
          pnpm --filter @pertexo/worker exec vitest run --config vitest.integration.config.ts \
            test/coordinator-consumer-retry-wait.integration.test.ts \
            test/coordinator-consumer-parallel-recovery.integration.test.ts \
            test/coordinator-consumer-foreach-cancellation.integration.test.ts \
            test/http-node-attempt.integration.test.ts \
            --reporter=json --outputFile=../../artifacts/recovery-worker-gates.json
          pnpm --filter @pertexo/api exec vitest run --config vitest.sse-resilience.config.ts \
            --reporter=json --outputFile=../../artifacts/recovery-api-gates.json
          pnpm --filter @pertexo/worker exec vitest run --config vitest.resilience.config.ts \
            --reporter=json --outputFile=../../artifacts/transport-resilience-gates.json
          node infrastructure/validate-vitest-gate-report.mjs \
            artifacts/recovery-worker-gates.json 'worker recovery gates' 4
          node infrastructure/validate-vitest-gate-report.mjs \
            artifacts/recovery-api-gates.json 'API SSE recovery gates' 1
          node infrastructure/validate-vitest-gate-report.mjs \
            artifacts/transport-resilience-gates.json 'worker transport recovery gates' 1
      - name: Capture recovery service logs
        if: failure()
        run: |
          docker compose ps --all > artifacts/service-status.log
          docker compose logs --no-color --timestamps postgres redis artifact-store > artifacts/service-logs.log
      - name: Upload recovery reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: recovery-reports
          path: artifacts/
          if-no-files-found: ignore
      - name: Stop disposable dependencies
        if: always()
        run: docker compose down -v --remove-orphans

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME:
        pertexo-ci-${{ github.run_id }}-${{ github.run_attempt }}-compatibility
      API_COMPATIBILITY_ROLLOUT_INTEGRATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build packages used by compatibility fixtures
        run: pnpm build
      - name: Start disposable compatibility database
        run: docker compose up -d --wait postgres
      - name: Run additive rollout and prior-head migration proofs
        run: |
          set -euo pipefail
          mkdir -p artifacts
          pnpm --filter @pertexo/api exec vitest run --config vitest.compatibility-rollout.config.ts \
            --reporter=json --outputFile=../../artifacts/api-compatibility-gates.json
          pnpm --filter @pertexo/database exec vitest run --config vitest.integration.config.ts \
            test/oidc-browser-binding-migration.integration.test.ts \
            --reporter=json --outputFile=../../artifacts/database-compatibility-gates.json
          node infrastructure/validate-vitest-gate-report.mjs \
            artifacts/api-compatibility-gates.json 'API compatibility gates' 1
          node infrastructure/validate-vitest-gate-report.mjs \
            artifacts/database-compatibility-gates.json 'database compatibility gates' 1
      - name: Capture compatibility database logs
        if: failure()
        run: |
          docker compose ps --all > artifacts/service-status.log
          docker compose logs --no-color --timestamps postgres > artifacts/service-logs.log
      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: compatibility-reports
          path: artifacts/
          if-no-files-found: ignore
      - name: Stop disposable dependencies
        if: always()
        run: docker compose down -v --remove-orphans

  deployment-security:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.22.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate dependencies, deployment, exercises, and image pins
        run: |
          set -o pipefail
          mkdir -p artifacts
          {
            pnpm security:audit
            pnpm deployment:check
            pnpm exercise:check
            pnpm images:check
            docker compose config --quiet
            docker compose -f infrastructure/observability/compose.yaml config --quiet
            pnpm observability:check
          } 2>&1 | tee artifacts/deployment-security.log
      - name: Upload deployment/security report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deployment-security-report
          path: artifacts/
          if-no-files-found: ignore

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

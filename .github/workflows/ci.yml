name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

# A new push replaces a pull request's older run. Runs on main all finish, each in
# its own group: every merged commit publishes its images.
concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' &&
    github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Service-consuming jobs run on their own runner and Compose project, so
# databases and Redis are disposable.
env:
  POSTGRES_DB: pertexo
  POSTGRES_PORT: '5432'
  POSTGRES_SUPERUSER: postgres
  POSTGRES_SUPERUSER_PASSWORD: pertexo-local-superuser
  POSTGRES_OWNER_USER: pertexo_owner
  POSTGRES_MIGRATION_USER: pertexo_migration
  POSTGRES_MIGRATION_PASSWORD: pertexo-local-migration
  POSTGRES_APP_USER: pertexo_app
  POSTGRES_APP_PASSWORD: pertexo-local-app
  POSTGRES_MAINTENANCE_USER: pertexo_maintenance
  POSTGRES_MAINTENANCE_PASSWORD: pertexo-local-maintenance
  DATABASE_ADMIN_URL: postgresql://postgres:pertexo-local-superuser@127.0.0.1:5432/postgres
  DATABASE_MIGRATION_URL: postgresql://pertexo_migration:pertexo-local-migration@127.0.0.1:5432/pertexo
  DATABASE_URL: postgresql://pertexo_app:pertexo-local-app@127.0.0.1:5432/pertexo
  DATABASE_MAINTENANCE_URL: postgresql://pertexo_maintenance:pertexo-local-maintenance@127.0.0.1:5432/pertexo
  REDIS_PASSWORD: pertexo-local-redis
  REDIS_PORT: '6379'
  REDIS_URL: redis://:pertexo-local-redis@127.0.0.1:6379/0
  ARTIFACT_STORE_PORT: '9090'
  ARTIFACT_STORE_ENDPOINT: http://127.0.0.1:9090
  ARTIFACT_STORE_REGION: us-east-1
  ARTIFACT_STORE_ACCESS_KEY_ID: pertexo-local-access-key
  ARTIFACT_STORE_SECRET_ACCESS_KEY: pertexo-local-secret-key
  ARTIFACT_STORE_BUCKET: pertexo-artifacts
  ARTIFACT_STORE_FORCE_PATH_STYLE: 'true'
  ARTIFACT_STORE_INTEGRATION: 'true'
  # CI pins the same reviewed manifests used by the Compose defaults.
  POSTGRES_IMAGE: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
  REDIS_IMAGE: redis:8.2.8-alpine@sha256:a7859ed111db3c1f5404a973a4747505d559fb5ca32d37e447afc0ef845a2103
  S3MOCK_IMAGE: adobe/s3mock:5.1.0@sha256:65cf60155a2e235fe7d5bf6c633747d6fc7ed93f9f5a6727d86470026b83c2a2
  API_SSE_INTEGRATION: 'true'
  API_IDENTITY_INTEGRATION: 'true'
  API_ARTIFACT_INTEGRATION: 'true'
  API_WEBHOOK_INTEGRATION: 'true'
  REDIS_RATE_LIMIT_INTEGRATION: 'true'
  QUEUE_INTEGRATION: 'true'
  WORKER_TRANSPORT_INTEGRATION: 'true'
  WORKER_TRIGGER_INTEGRATION: 'true'

jobs:
  # Pushes and scheduled runs always run everything; a pull request that only
  # touches docs skips the heavy jobs, and `ci-passed` still reports its result.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          code=true
          if [ "$EVENT_NAME" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPOSITORY/pulls/$PULL_REQUEST/files" --jq '.[].filename')
            if ! printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  docs:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Format
        run: pnpm format:check

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Format
        run: pnpm format:check
      - name: Build
        run: pnpm build
      - name: Single-server deployment checks
        run: node --test infrastructure/single-server/test/*.test.mjs
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unused code and dependencies
        run: pnpm dependencies:check
      - name: Generated contracts are current
        run: pnpm contracts:check
      - name: Database schema matches migrations
        run: pnpm database:schema:check
      - name: Package boundaries
        run: pnpm architecture:check

  unit:
    name: unit (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: core
            filter: >-
              --filter @pertexo/contracts --filter @pertexo/execution --filter
              @pertexo/integrations --filter @pertexo/node-catalog --filter
              @pertexo/node-sdk --filter @pertexo/nodes-core --filter
              @pertexo/observability --filter @pertexo/queue --filter
              @pertexo/rate-limit --filter @pertexo/templates --filter
              @pertexo/workflow-engine --filter @pertexo/workflow-model --filter
              @pertexo/artifact-store --filter @pertexo/database
          - group: apps
            filter: >-
              --filter @pertexo/api --filter @pertexo/worker --filter
              @pertexo/ops --filter @pertexo/cli --filter @pertexo/web
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Build
        run: pnpm build
      - name: Unit tests
        run:
          pnpm ${{ matrix.filter }} --workspace-concurrency=1 run --if-present
          test

  integration:
    name: integration (${{ matrix.group }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The worker suite runs its files one at a time against shared
        # services, so it is split across its own runners.
        include:
          - group: database
          - group: services
          - group: worker-1
            shard: 1/2
          - group: worker-2
            shard: 2/2
    env:
      # Tests that own their fixtures expect the project suffix `-integration`.
      COMPOSE_PROJECT_NAME:
        pertexo-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{
        matrix.group == 'database' && 'database' || 'integration' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Use the Docker Hub mirror
        uses: ./.github/actions/docker-mirror
      - name: Build
        # These tests never load the web bundle.
        run: pnpm build:packages
      - name: Start services
        run: docker compose up -d --wait postgres redis artifact-store
      - name: Migrate
        run: pnpm db:migrate
      - name: Record owned-fixture manifest
        run: |
          set -euo pipefail
          postgres_id=$(docker inspect --format '{{.Id}}' "$(docker compose ps -q postgres)")
          redis_id=$(docker inspect --format '{{.Id}}' "$(docker compose ps -q redis)")
          manifest=$(jq -cn \
            --arg project "$COMPOSE_PROJECT_NAME" --arg postgres "$postgres_id" --arg redis "$redis_id" \
            --argjson postgresPort "$POSTGRES_PORT" --argjson redisPort "$REDIS_PORT" \
            '{project:$project,postgres:{id:$postgres,port:$postgresPort},redis:{id:$redis,port:$redisPort}}')
          echo "EDITOR_BROWSER_OWNERSHIP_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Database integration tests
        if: matrix.group == 'database'
        run: |
          set -euo pipefail
          pnpm --filter @pertexo/database exec vitest run --config vitest.integration.config.ts \
            --exclude 'test/authoring/organization/**'
          EDITOR_BROWSER_OWNED_FIXTURE=true F07_ORGANIZATION_OWNED_FIXTURE=true \
            pnpm --filter @pertexo/database exec vitest run --config vitest.integration.config.ts \
            test/authoring/organization/
      - name: Service integration tests
        if: matrix.group == 'services'
        env:
          CONNECTION_HEALTH_COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          pnpm --filter @pertexo/artifact-store exec vitest run --config vitest.integration.config.ts
          pnpm --filter @pertexo/queue exec vitest run --config vitest.integration.config.ts
          pnpm --filter @pertexo/api exec vitest run --config vitest.integration.config.ts \
            --exclude 'test/browser/*.integration.test.ts' \
            --exclude 'test/workflow-authoring/organization/**'
          # Flag-gated files live in this directory, so a new one cannot be skipped.
          EDITOR_BROWSER_OWNED_FIXTURE=true F07_ORGANIZATION_OWNED_FIXTURE=true \
            pnpm --filter @pertexo/api exec vitest run --config vitest.integration.config.ts \
            test/workflow-authoring/organization/
          # Last: these stop and restart Redis.
          WORKER_TRANSPORT_RESILIENCE=true \
            pnpm --filter @pertexo/worker exec vitest run --config vitest.resilience.config.ts
          API_SSE_RESILIENCE_INTEGRATION=true \
            pnpm --filter @pertexo/api exec vitest run --config vitest.sse-resilience.config.ts
      - name: Worker integration tests
        if: startsWith(matrix.group, 'worker-')
        env:
          CONNECTION_HEALTH_COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
          SHARD: ${{ matrix.shard }}
        run:
          pnpm --filter @pertexo/worker exec vitest run --config
          vitest.integration.config.ts --shard="$SHARD"
      - name: Qualify pinned beta storage
        if: matrix.group == 'services'
        run: node infrastructure/single-server/storage/qualify.mjs
      - name: Qualify matched beta recovery
        if: matrix.group == 'services'
        run: node infrastructure/single-server/backup/qualify.mjs
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans

  # Real faults against real processes. They stop Postgres, Redis and the object
  # store, so nothing else shares their compose project. About 50 minutes, so it runs
  # on main and nightly and no pull request waits for it.
  faults:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A stuck run makes a fault test wait out its full recovery limit.
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT_NAME:
        pertexo-ci-${{ github.run_id }}-${{ github.run_attempt }}-integration
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Use the Docker Hub mirror
        uses: ./.github/actions/docker-mirror
      - name: Build
        run: pnpm build:packages
      - name: Start services
        run: docker compose up -d --wait postgres redis artifact-store
      - name: Migrate
        run: pnpm db:migrate
      - name: Fault tests
        run: pnpm --filter @pertexo/worker test:fault
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --timestamps
      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans

  # The mocked suite and three shards of real-stack journeys run side by side
  # on separate runners; one long sequential job had grown past 25 minutes.
  browser:
    name: browser (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Keep browser OS dependencies stable across ubuntu-latest image rollouts.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Live shards are balanced by measured duration (about 5.5 minutes
        # each) and keep the journeys' original order. Put a new journey on
        # the lightest shard.
        include:
          - suite: mocked
            journeys: ''
          - suite: live-1
            journeys: >-
              usage failure-routing error-workflows approvals variables
              notifications artifact-inputs webhook-responses code
              organization-saml schedule form-uploads security
          - suite: live-2
            journeys: >-
              workflow-concurrency connection-health input-cases callable
              webhook-controlled-http api-tokens workflow-organization receipts
              readonly nested-conflict email-attachments task-timeouts product
          - suite: live-3
            journeys: >-
              duplication portability curated-templates run-recovery forms
              transforms pinned-samples governance promotion collaboration
              federation organization-oidc two-factor http-pagination run-values
              expression-admission spreadsheets
    env:
      COMPOSE_PROJECT_NAME:
        pertexo-ci-${{ github.run_id }}-${{ github.run_attempt }}-browser
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Use Ubuntu HTTPS mirrors for browser dependencies
        run: >-
          sudo sed -i '/^http:\/\/azure[.]archive[.]ubuntu[.]com\/ubuntu\//d'
          /etc/apt/apt-mirrors.txt
      - name: Install Playwright browsers
        if: matrix.journeys == ''
        run: pnpm --filter @pertexo/web exec playwright install --with-deps
      - name: Browser tests against the mocked API
        if: matrix.journeys == ''
        run: pnpm --filter @pertexo/web test:e2e
      - name: Use the Docker Hub mirror
        if: matrix.journeys != ''
        uses: ./.github/actions/docker-mirror
      - name: Install Chromium
        if: matrix.journeys != ''
        run:
          pnpm --filter @pertexo/web exec playwright install --with-deps
          chromium
      - name: Install the pinned Code-step Python for the real browser journey
        if: matrix.suite == 'live-1'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.1'
      - name: Build API, worker, CLI and web dependencies
        if: matrix.journeys != ''
        run:
          pnpm --filter @pertexo/api... --filter @pertexo/worker... --filter
          @pertexo/ops... --filter @pertexo/cli... --filter
          @pertexo/code-runner... --filter '@pertexo/web^...' build
      - name: Start services
        if: matrix.journeys != ''
        run: docker compose up -d --wait postgres redis artifact-store
      - name: Browser journeys against the real stack
        if: matrix.journeys != ''
        env:
          JOURNEYS: ${{ matrix.journeys }}
          WORKFLOW_CONCURRENCY_COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
          CONNECTION_HEALTH_COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          live() {
            pnpm --filter @pertexo/api exec vitest run --config vitest.integration.config.ts "$@"
          }
          journey() {
            case "$1" in
              usage) USAGE_BROWSER_INTEGRATION=true live test/browser/usage.integration.test.ts ;;
              security) SECURITY_BROWSER_INTEGRATION=true live test/browser/security/real-web.integration.test.ts ;;
              organization-saml)
                EDITOR_BROWSER_INTEGRATION=true EDITOR_BROWSER_CASE=organization-saml EDITOR_BROWSER_OWNED_FIXTURE=true \
                  live test/browser/editor/federation/saml.integration.test.ts ;;
              workflow-concurrency)
                WORKFLOW_CONCURRENCY_BROWSER_INTEGRATION=true live test/browser/workflow-concurrency.integration.test.ts ;;
              connection-health)
                CONNECTION_HEALTH_BROWSER_INTEGRATION=true live test/browser/connection-health.integration.test.ts ;;
              workflow-organization)
                EDITOR_BROWSER_OWNED_FIXTURE=true F07_ORGANIZATION_OWNED_FIXTURE=true F07_ORGANIZATION_BROWSER_INTEGRATION=true \
                  live test/browser/workflow-organization.integration.test.ts ;;
              *)
                EDITOR_BROWSER_INTEGRATION=true EDITOR_BROWSER_CASE="$1" EDITOR_BROWSER_OWNED_FIXTURE=true \
                  live test/browser/editor.integration.test.ts ;;
            esac
          }
          postgres_id=$(docker inspect --format '{{.Id}}' "$(docker compose ps -q postgres)")
          redis_id=$(docker inspect --format '{{.Id}}' "$(docker compose ps -q redis)")
          artifact_id=$(docker inspect --format '{{.Id}}' "$(docker compose ps -q artifact-store)")
          export EDITOR_BROWSER_OWNERSHIP_MANIFEST=$(jq -cn \
            --arg project "$COMPOSE_PROJECT_NAME" --arg postgres "$postgres_id" --arg redis "$redis_id" --arg artifact "$artifact_id" \
            --argjson postgresPort "$POSTGRES_PORT" --argjson redisPort "$REDIS_PORT" --argjson artifactPort "$ARTIFACT_STORE_PORT" \
            '{project:$project,postgres:{id:$postgres,port:$postgresPort},redis:{id:$redis,port:$redisPort},artifactStore:{id:$artifact,port:$artifactPort}}')
          for browser_journey in $JOURNEYS; do
            journey "$browser_journey"
          done
      - name: Stop services
        if: always() && matrix.journeys != ''
        run: docker compose down -v --remove-orphans
      - name: Upload browser traces
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: browser-traces-${{ matrix.suite }}
          path: apps/web/test-results/
          if-no-files-found: ignore

  # Every browser leg must pass; `ci-passed` reports this result.
  e2e:
    if: ${{ !cancelled() }}
    needs: browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every browser leg
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = success -o "$BROWSER_RESULT" = skipped

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use the Docker Hub mirror
        uses: ./.github/actions/docker-mirror
      - name: Set up Node.js for the transport probe
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Build production image
        run:
          docker buildx build --load --target runtime --build-arg
          SOURCE_COMMIT=${{ github.sha }} --tag pertexo-ci:${{ github.sha }} .
      - name:
          Runs as non-root on a read-only filesystem and loads every entrypoint
        run: |
          set -euo pipefail
          test "$(docker run --rm --read-only --tmpfs /tmp --entrypoint id pertexo-ci:${{ github.sha }} -u)" = 10001
          docker run --rm --read-only --tmpfs /tmp --entrypoint node \
            pertexo-ci:${{ github.sha }} --input-type=module --eval \
            "await Promise.all([
              import('./apps/api/dist/app.js'),
              import('./apps/worker/dist/app.js'),
              import('./apps/ops/dist/run.js'),
              import('./packages/database/dist/migrations.js')
            ])"
      - name: Qualify beta operational helpers in the production image
        run:
          node infrastructure/single-server/backup/verify-runtime.mjs
          pertexo-ci:${{ github.sha }}
      - name: Qualify hardened Code isolation in the production image
        run:
          node infrastructure/images/code/verify.mjs pertexo-ci:${{ github.sha
          }}
      - name: Build and qualify the web image
        run: |
          set -euo pipefail
          docker buildx build --load --target web --build-arg SOURCE_COMMIT=${{ github.sha }} \
            --tag pertexo-web-ci:${{ github.sha }} .
          proxy_image="$(node infrastructure/images/proxy/image.mjs)"
          docker pull "$proxy_image"
          node infrastructure/images/verify-web.mjs pertexo-ci:${{ github.sha }} pertexo-web-ci:${{ github.sha }} "$proxy_image"

  # Every merged commit gets images, built and qualified here on its own architecture.
  # Test jobs decide what may ship (release.yml and deploy.yml check them); a flaky one
  # must not leave a commit with nothing to pull.
  publish-image:
    name: publish-image (${{ matrix.architecture }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use the Docker Hub mirror
        uses: ./.github/actions/docker-mirror
      - name: Set up Node.js for the transport probe
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Build and qualify native images
        run: |
          set -euo pipefail
          tag="$GITHUB_SHA-$ARCHITECTURE"
          docker buildx build --load --platform "$PLATFORM" --target runtime \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag ghcr.io/vigani1/pertexo:"$tag" .
          docker buildx build --load --platform "$PLATFORM" --target web \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag ghcr.io/vigani1/pertexo-web:"$tag" .
          test "$(docker image inspect --format '{{.Architecture}}' ghcr.io/vigani1/pertexo:"$tag")" = "$ARCHITECTURE"
          test "$(docker run --rm --read-only --tmpfs /tmp --entrypoint id ghcr.io/vigani1/pertexo:"$tag" -u)" = 10001
          docker run --rm --read-only --tmpfs /tmp --entrypoint node \
            ghcr.io/vigani1/pertexo:"$tag" --input-type=module --eval \
            "await Promise.all([
              import('./apps/api/dist/app.js'),
              import('./apps/worker/dist/app.js'),
              import('./apps/ops/dist/run.js'),
              import('./packages/database/dist/migrations.js')
            ])"
          node infrastructure/single-server/backup/verify-runtime.mjs ghcr.io/vigani1/pertexo:"$tag"
          node infrastructure/images/code/verify.mjs ghcr.io/vigani1/pertexo:"$tag"
          proxy_image="$(node infrastructure/images/proxy/image.mjs)"
          docker pull "$proxy_image"
          node infrastructure/images/verify-web.mjs ghcr.io/vigani1/pertexo:"$tag" ghcr.io/vigani1/pertexo-web:"$tag" "$proxy_image"
      - name: Publish this architecture to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for image in ghcr.io/vigani1/pertexo ghcr.io/vigani1/pertexo-web; do
            docker push "$image:$GITHUB_SHA-$ARCHITECTURE"
          done
          docker logout ghcr.io

  # deploy.sh pulls one tag per commit, and Docker picks the server's architecture.
  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Publish the commit tag for both architectures
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for image in ghcr.io/vigani1/pertexo ghcr.io/vigani1/pertexo-web; do
            # A rerun must not replace an already published release tag.
            if ! docker manifest inspect "$image:$GITHUB_SHA" >/dev/null 2>&1; then
              docker buildx imagetools create --tag "$image:$GITHUB_SHA" \
                "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
            fi
          done
          docker logout ghcr.io

  # Tells self-host-drill whether a pull request touched what it covers.
  self-host-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      touched: ${{ steps.classify.outputs.touched }}
    steps:
      - name: Classify the change
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=$(gh api --paginate "repos/$REPOSITORY/pulls/$PULL_REQUEST/files" --jq '.[].filename')
          touched=false
          if printf '%s\n' "$files" | grep -qE '^infrastructure/|(^|/)Dockerfile|^apps/web/deployment/'; then touched=true; fi
          echo "touched=$touched" >> "$GITHUB_OUTPUT"

  # The operator's whole life with the single-server stack, through the real scripts
  # and a real stack on each architecture we publish. About 22 minutes a leg, so a pull
  # request waits for it only when it touched what this covers. An image never waits.
  self-host-drill:
    name: self-host-drill (${{ matrix.runner }})
    needs: self-host-changes
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
      needs.self-host-changes.outputs.touched == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Use the Docker Hub mirror
        uses: ./.github/actions/docker-mirror
      - name: Build the images once
        run: node infrastructure/single-server/test/drill/build-images.mjs
      - name: Web tier
        run: node --test infrastructure/single-server/test/drill/proxy.test.mjs
      - name: Real deploy, backup and restore
        run: node --test infrastructure/single-server/test/drill/stack.test.mjs
      - name: Quick try
        run:
          node --test
          infrastructure/single-server/test/drill/quickstart.test.mjs

  security:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Audit production dependencies
        run: pnpm security:audit
      - name: Reject vulnerable dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # The one required check. A skipped matrix never reports its per-leg names, so
  # branch protection can't require them directly.
  ci-passed:
    if: ${{ !cancelled() }}
    needs:
      [
        changes,
        docs,
        check,
        unit,
        integration,
        e2e,
        image,
        security,
        self-host-drill,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "A required job finished as $result: $RESULTS"
                exit 1
                ;;
            esac
          done

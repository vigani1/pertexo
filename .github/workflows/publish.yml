name: Publish images

# Every merged commit gets images, built and qualified here on its own architecture,
# whatever CI thinks of the commit. Test jobs decide what may ship (release.yml and
# deploy.yml check them); a flaky one must not leave a commit with nothing to pull.
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-image:
    name: publish-image (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use the Docker Hub mirror
        uses: ./.github/actions/docker-mirror
      - name: Set up Node.js for the transport probe
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
      - name: Build and qualify native images
        run: |
          set -euo pipefail
          tag="$GITHUB_SHA-$ARCHITECTURE"
          .github/scripts/retry-once.sh docker buildx build --load --platform "$PLATFORM" --target runtime \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag ghcr.io/vigani1/pertexo:"$tag" .
          .github/scripts/retry-once.sh docker buildx build --load --platform "$PLATFORM" --target web \
            --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag ghcr.io/vigani1/pertexo-web:"$tag" .
          test "$(docker image inspect --format '{{.Architecture}}' ghcr.io/vigani1/pertexo:"$tag")" = "$ARCHITECTURE"
          test "$(docker run --rm --read-only --tmpfs /tmp --entrypoint id ghcr.io/vigani1/pertexo:"$tag" -u)" = 10001
          docker run --rm --read-only --tmpfs /tmp --entrypoint node \
            ghcr.io/vigani1/pertexo:"$tag" --input-type=module --eval \
            "await Promise.all([
              import('./apps/api/dist/app.js'),
              import('./apps/worker/dist/worker-application.js'),
              import('./apps/ops/dist/execute-operator-command.js'),
              import('./packages/database/dist/migrations.js')
            ])"
          node infrastructure/single-server/backup/verify-runtime.mjs ghcr.io/vigani1/pertexo:"$tag"
          node infrastructure/images/code/verify.mjs ghcr.io/vigani1/pertexo:"$tag"
          proxy_image="$(node infrastructure/images/proxy/image.mjs)"
          .github/scripts/retry-once.sh docker pull "$proxy_image"
          node infrastructure/images/verify-web.mjs ghcr.io/vigani1/pertexo:"$tag" ghcr.io/vigani1/pertexo-web:"$tag" "$proxy_image"
      - name: Publish this architecture to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for image in ghcr.io/vigani1/pertexo ghcr.io/vigani1/pertexo-web; do
            .github/scripts/retry-once.sh docker push "$image:$GITHUB_SHA-$ARCHITECTURE"
          done
          docker logout ghcr.io

  # deploy.sh pulls one tag per commit, and Docker picks the server's architecture.
  publish-images:
    needs: publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Publish the commit tag for both architectures
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for image in ghcr.io/vigani1/pertexo ghcr.io/vigani1/pertexo-web; do
            # A rerun must not replace an already published release tag.
            if ! docker manifest inspect "$image:$GITHUB_SHA" >/dev/null 2>&1; then
              .github/scripts/retry-once.sh docker buildx imagetools create --tag "$image:$GITHUB_SHA" \
                "$image:$GITHUB_SHA-amd64" "$image:$GITHUB_SHA-arm64"
            fi
          done
          docker logout ghcr.io

services:
  postgres:
    # A health probe Docker abandons is reparented to PID 1 and later exits
    # non-zero. As PID 1 the postmaster would take that for a crashed child and
    # restart every connection; an init process reaps it instead.
    init: true
    # postgres:18; manifest digest resolved 2026-08-30
    image: ${POSTGRES_IMAGE:-postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pertexo}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-pertexo-local-superuser}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-pertexo_owner}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-pertexo_migration}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-pertexo-local-migration}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-pertexo_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-pertexo-local-app}
      POSTGRES_MAINTENANCE_USER: ${POSTGRES_MAINTENANCE_USER:-pertexo_maintenance}
      POSTGRES_MAINTENANCE_PASSWORD: ${POSTGRES_MAINTENANCE_PASSWORD:-pertexo-local-maintenance}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - pg_stat_statements.max=20000
      # Test suites run four files at once, each with its own pools.
      - -c
      - max_connections=300
      # On unless a throwaway database asks otherwise: CI turns these off.
      - -c
      - fsync=${POSTGRES_DURABILITY:-on}
      - -c
      - full_page_writes=${POSTGRES_DURABILITY:-on}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pertexo-postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -t 2 -U "$${POSTGRES_APP_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 1m

  redis:
    # redis:8.2.8-alpine; manifest digest resolved 2026-08-30
    image: ${REDIS_IMAGE:-redis:8.10.2-alpine@sha256:9f8d2d789b9a1d1e3f283f979aa9cbf393373806472e1ccd460e2f9c869b833b}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pertexo-local-redis}
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-pertexo-local-redis}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - pertexo-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q
          PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s

  artifact-store:
    # adobe/s3mock:5.1.0; manifest digest resolved 2026-08-30
    image: ${S3MOCK_IMAGE:-adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92}
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ${ARTIFACT_STORE_REGION:-us-east-1}
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${ARTIFACT_STORE_BUCKET:-pertexo-artifacts}
    ports:
      - '127.0.0.1:${ARTIFACT_STORE_PORT:-9090}:9090'
    volumes:
      - pertexo-artifact-data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:9090/favicon.ico
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s

volumes:
  pertexo-postgres-data:
  pertexo-redis-data:
  pertexo-artifact-data:

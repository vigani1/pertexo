services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pertexo}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-pertexo-local-superuser}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-pertexo_owner}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-pertexo_migration}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-pertexo-local-migration}
      POSTGRES_MAINTENANCE_USER: ${POSTGRES_MAINTENANCE_USER:-pertexo_maintenance}
      POSTGRES_MAINTENANCE_PASSWORD: ${POSTGRES_MAINTENANCE_PASSWORD:-pertexo-local-maintenance}
      POSTGRES_LIFECYCLE_COMMAND_USER: ${POSTGRES_LIFECYCLE_COMMAND_USER:-pertexo_lifecycle_command}
      POSTGRES_LIFECYCLE_COMMAND_PASSWORD: ${POSTGRES_LIFECYCLE_COMMAND_PASSWORD:-pertexo-local-lifecycle-command}
      POSTGRES_OPERATOR_USER: ${POSTGRES_OPERATOR_USER:-pertexo_operator}
      POSTGRES_OPERATOR_PASSWORD: ${POSTGRES_OPERATOR_PASSWORD:-pertexo-local-operator}
      POSTGRES_API_RUNTIME_USER: ${POSTGRES_API_RUNTIME_USER:-pertexo_api}
      POSTGRES_API_RUNTIME_PASSWORD: ${POSTGRES_API_RUNTIME_PASSWORD:-pertexo-local-api}
      POSTGRES_WORKER_RUNTIME_USER: ${POSTGRES_WORKER_RUNTIME_USER:-pertexo_worker}
      POSTGRES_WORKER_RUNTIME_PASSWORD: ${POSTGRES_WORKER_RUNTIME_PASSWORD:-pertexo-local-worker}
      POSTGRES_DISPATCHER_RUNTIME_USER: ${POSTGRES_DISPATCHER_RUNTIME_USER:-pertexo_dispatcher}
      POSTGRES_DISPATCHER_RUNTIME_PASSWORD: ${POSTGRES_DISPATCHER_RUNTIME_PASSWORD:-pertexo-local-dispatcher}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pertexo-postgres-data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_API_RUNTIME_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 1m

  redis:
    image: ${REDIS_IMAGE:-redis:8.2.8-alpine}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pertexo-local-redis}
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-pertexo-local-redis}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - pertexo-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q
          PONG
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s

  artifact-store:
    image: ${S3MOCK_IMAGE:-adobe/s3mock:5.1.0}
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: ${ARTIFACT_STORE_REGION:-us-east-1}
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${ARTIFACT_STORE_BUCKET:-pertexo-artifacts},${CONTROL_LEDGER_BUCKET:-pertexo-control-ledger},${CONTROL_LEDGER_RECOVERY_BUCKET:-pertexo-control-ledger-recovery}
    ports:
      - '127.0.0.1:${ARTIFACT_STORE_PORT:-9090}:9090'
    volumes:
      - pertexo-artifact-data:/data
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - -q
        - http://localhost:9090/favicon.ico
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    stop_grace_period: 30s

  control-ledger-primary:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${CONTROL_LEDGER_ADMIN_ACCESS_KEY_ID:-pertexo-local-primary-admin}
      MINIO_ROOT_PASSWORD: ${CONTROL_LEDGER_ADMIN_SECRET_ACCESS_KEY:-pertexo-local-primary-admin-secret}
      MINIO_REGION_NAME: ${CONTROL_LEDGER_REGION:-eu-central-1}
    ports:
      - '127.0.0.1:${CONTROL_LEDGER_PORT:-9091}:9000'
    volumes:
      - pertexo-control-ledger-primary-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  control-ledger-primary-bootstrap:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: 'no'
    depends_on:
      control-ledger-primary:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /bootstrap/bootstrap-ledger.sh
    environment:
      LEDGER_ENDPOINT: http://control-ledger-primary:9000
      LEDGER_POLICY_FILE: primary-ledger-policy.json
      LEDGER_ADMIN_ACCESS_KEY_ID: ${CONTROL_LEDGER_ADMIN_ACCESS_KEY_ID:-pertexo-local-primary-admin}
      LEDGER_ADMIN_SECRET_ACCESS_KEY: ${CONTROL_LEDGER_ADMIN_SECRET_ACCESS_KEY:-pertexo-local-primary-admin-secret}
      LEDGER_ACCESS_KEY_ID: ${CONTROL_LEDGER_ACCESS_KEY_ID:-pertexo-local-ledger-primary}
      LEDGER_SECRET_ACCESS_KEY: ${CONTROL_LEDGER_SECRET_ACCESS_KEY:-pertexo-local-ledger-primary-secret}
    volumes:
      - ./infrastructure/minio:/bootstrap:ro

  control-ledger-recovery:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9002
    environment:
      MINIO_ROOT_USER: ${CONTROL_LEDGER_RECOVERY_ADMIN_ACCESS_KEY_ID:-pertexo-local-recovery-admin}
      MINIO_ROOT_PASSWORD: ${CONTROL_LEDGER_RECOVERY_ADMIN_SECRET_ACCESS_KEY:-pertexo-local-recovery-admin-secret}
      MINIO_REGION_NAME: ${CONTROL_LEDGER_RECOVERY_REGION:-eu-west-1}
    ports:
      - '127.0.0.1:${CONTROL_LEDGER_RECOVERY_PORT:-9092}:9000'
    volumes:
      - pertexo-control-ledger-recovery-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

  control-ledger-recovery-bootstrap:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: 'no'
    depends_on:
      control-ledger-recovery:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /bootstrap/bootstrap-ledger.sh
    environment:
      LEDGER_ENDPOINT: http://control-ledger-recovery:9000
      LEDGER_POLICY_FILE: recovery-ledger-policy.json
      LEDGER_ADMIN_ACCESS_KEY_ID: ${CONTROL_LEDGER_RECOVERY_ADMIN_ACCESS_KEY_ID:-pertexo-local-recovery-admin}
      LEDGER_ADMIN_SECRET_ACCESS_KEY: ${CONTROL_LEDGER_RECOVERY_ADMIN_SECRET_ACCESS_KEY:-pertexo-local-recovery-admin-secret}
      LEDGER_ACCESS_KEY_ID: ${CONTROL_LEDGER_RECOVERY_ACCESS_KEY_ID:-pertexo-local-ledger-recovery}
      LEDGER_SECRET_ACCESS_KEY: ${CONTROL_LEDGER_RECOVERY_SECRET_ACCESS_KEY:-pertexo-local-ledger-recovery-secret}
    volumes:
      - ./infrastructure/minio:/bootstrap:ro

volumes:
  pertexo-postgres-data:
  pertexo-redis-data:
  pertexo-artifact-data:
  pertexo-control-ledger-primary-data:
  pertexo-control-ledger-recovery-data:

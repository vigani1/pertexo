<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" role="img" aria-labelledby="title description">
  <title id="title">Pertexo architecture</title>
  <desc id="description">People use the web app, which talks to the API over /v1 with live updates. Other systems send signed webhooks to the API. The API and the worker keep runs and checkpoints in PostgreSQL, the source of truth. The worker takes jobs from Redis and BullMQ, calls HTTP, Slack and email, and stores files in S3-compatible storage, which browsers reach through presigned links.</desc>
  <defs>
    <style>
      .frame { fill: #0f1215; stroke: rgba(255, 255, 255, 0.07); }
      .box { fill: #161a1e; stroke: rgba(255, 255, 255, 0.1); }
      .truth { stroke: rgba(106, 212, 230, 0.55); }
      .outside { fill: none; stroke: rgba(255, 255, 255, 0.22); stroke-dasharray: 4 5; }
      .name { fill: #e8ebee; font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .role { fill: #8f99a3; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .label { fill: #7d8790; font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .thread { fill: none; stroke: #6ad4e6; stroke-width: 1.6; stroke-linecap: round; opacity: 0.75; }
      .link { fill: none; stroke: #6ad4e6; stroke-width: 1.4; stroke-dasharray: 2 5; stroke-linecap: round; opacity: 0.6; }
      .bead { fill: #6ad4e6; }
      .loop { fill: #0f1215; stroke: #6ad4e6; stroke-width: 1.4; }
    </style>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#6ad4e6" stop-opacity="0.09" />
      <stop offset="1" stop-color="#6ad4e6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect class="frame" x="0.5" y="0.5" width="959" height="509" rx="16" />
  <rect x="0.5" y="0.5" width="959" height="509" rx="16" fill="url(#glow)" />

  <!-- Threads: a hollow loop where work leaves, a lit bead where it arrives. -->
  <path class="thread" d="M170 158 H220" />
  <path class="thread" d="M400 158 H480" />
  <text class="label" x="440" y="144" text-anchor="middle">/v1 · live</text>
  <path class="thread" d="M660 158 H740" />
  <text class="label" x="700" y="144" text-anchor="middle">writes</text>
  <path class="thread" d="M570 66 V120" />
  <text class="label" x="582" y="97">signed webhooks</text>
  <path class="thread" d="M660 334 C 730 334, 835 290, 835 196" />
  <text class="label" x="800" y="250" text-anchor="end">runs · checkpoints</text>
  <path class="thread" d="M660 362 H740" />
  <text class="label" x="700" y="380" text-anchor="middle">jobs</text>
  <path class="thread" d="M480 348 H400" />
  <text class="label" x="440" y="334" text-anchor="middle">files</text>
  <path class="thread" d="M570 386 V440" />
  <path class="link" d="M310 196 V310" />
  <text class="label" x="300" y="250" text-anchor="end">presigned</text>
  <text class="label" x="300" y="264" text-anchor="end">links</text>

  <circle class="loop" cx="170" cy="158" r="3.5" />
  <circle class="bead" cx="220" cy="158" r="3.5" />
  <circle class="loop" cx="400" cy="158" r="3.5" />
  <circle class="bead" cx="480" cy="158" r="3.5" />
  <circle class="loop" cx="660" cy="158" r="3.5" />
  <circle class="bead" cx="740" cy="158" r="3.5" />
  <circle class="loop" cx="570" cy="66" r="3.5" />
  <circle class="bead" cx="570" cy="120" r="3.5" />
  <circle class="loop" cx="660" cy="334" r="3.5" />
  <circle class="bead" cx="835" cy="196" r="3.5" />
  <circle class="loop" cx="660" cy="362" r="3.5" />
  <circle class="bead" cx="740" cy="362" r="3.5" />
  <circle class="loop" cx="480" cy="348" r="3.5" />
  <circle class="bead" cx="400" cy="348" r="3.5" />
  <circle class="loop" cx="570" cy="386" r="3.5" />
  <circle class="bead" cx="570" cy="440" r="3.5" />
  <circle class="bead" cx="310" cy="310" r="3.5" />

  <!-- Outside Pertexo: dashed outlines. -->
  <rect class="outside" x="30" y="130" width="140" height="56" rx="28" />
  <text class="name" x="100" y="163" text-anchor="middle">People</text>
  <rect class="outside" x="480" y="20" width="180" height="46" rx="23" />
  <text class="name" x="570" y="48" text-anchor="middle">Other systems</text>
  <rect class="outside" x="460" y="440" width="220" height="50" rx="25" />
  <text class="name" x="570" y="470" text-anchor="middle">HTTP · Slack · email</text>

  <rect class="box" x="220" y="120" width="180" height="76" rx="12" />
  <text class="name" x="240" y="153">Web app</text>
  <text class="role" x="240" y="174">React · Vite</text>

  <rect class="box" x="480" y="120" width="180" height="76" rx="12" />
  <text class="name" x="500" y="153">API</text>
  <text class="role" x="500" y="174">NestJS · Fastify</text>

  <rect class="box truth" x="740" y="120" width="190" height="76" rx="12" />
  <text class="name" x="760" y="153">PostgreSQL</text>
  <text class="role" x="760" y="174">source of truth · RLS</text>

  <rect class="box" x="220" y="310" width="180" height="76" rx="12" />
  <text class="name" x="240" y="343">File storage</text>
  <text class="role" x="240" y="364">S3-compatible</text>

  <rect class="box" x="480" y="310" width="180" height="76" rx="12" />
  <text class="name" x="500" y="343">Worker</text>
  <text class="role" x="500" y="364">engine · attempts</text>

  <rect class="box" x="740" y="310" width="190" height="76" rx="12" />
  <text class="name" x="760" y="343">Redis · BullMQ</text>
  <text class="role" x="760" y="364">rebuildable transport</text>
</svg>
